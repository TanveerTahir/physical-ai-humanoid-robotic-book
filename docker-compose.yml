version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_physical_ai
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant_data
    restart: unless-stopped

  # Uncomment when Neon DB integration is implemented
  # db:
  #   image: postgres:15
  #   container_name: neon_db_physical_ai
  #   environment:
  #     POSTGRES_DB: physical_ai_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data: